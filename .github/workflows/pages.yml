# Deploy โฟลเดอร์ game/ ไป GitHub Pages ทุกครั้งที่ push เข้า main
# เปิดใช้: Settings → Pages → Source: GitHub Actions
name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check game content, keys and assets
        run: node tools/check.js
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
