# ตรวจเกมทุก push และทุก PR · deploy โฟลเดอร์ game/ ไป GitHub Pages เฉพาะเมื่อ push เข้า main
# เปิดใช้: Settings → Pages → Source: GitHub Actions
# แยกเป็น 2 job เพราะ environment github-pages อนุญาตเฉพาะ main — PR จากสาขาอื่นจึงต้องตรวจใน job ที่ไม่ผูก environment
name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check game content, keys and assets
        run: node tools/check.js

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
