<body>
<header class="topbar">
  <button class="brand" id="homeBtn" title="กลับหน้าแผนที่"><img class="brand-mark" src="assets/app/icon-192.png?v=0.8.0-preview" alt="" width="35" height="35"><span>ร้านชำจำลอง</span><small>Marketing Training Lab</small></button>
  <div class="top-right">
    <span class="badge" id="productBadge"></span>
    <span class="badge star" id="starBadge">⭐ 0</span>
    <button class="icon-btn" id="soundBtn" aria-label="เสียงเกม" title="เปิดหรือปิดเสียงเกม">🔊</button>
    <button class="icon-btn" id="ttsBtn" aria-label="เสียงพูด" title="เปิดหรือปิดเสียงพูด">🗣️</button>
    <button class="icon-btn" id="menuBtn" aria-label="ตั้งค่า" title="ตั้งค่า">⚙️</button>
  </div>
</header>

<main id="app" aria-live="polite">
  <section class="hero shop-hero" aria-labelledby="shop-title">
    <div class="shop-copy"><h1 id="shop-title">ร้านชำจำลอง</h1>
      <p>ฝึกการตลาดผ่านงานในร้าน ตั้งแต่สังเกตลูกค้า เทียบราคา ไปจนถึงทดลองโปรและทำแฟ้มผลงาน</p>
      <div class="shop-meta"><span class="shop-course">8 สัปดาห์ · 40 รอบฝึก</span>
        <button class="shop-install" id="showInstall" type="button" aria-controls="install-app">วิธีติดตั้งเกม</button></div>
    </div>
    <div class="shop-window" aria-hidden="true">
      <div class="shop-awning"></div>
      <img class="shop-shelf" src="assets/app/front-shelf.webp?v=0.8.0-preview" alt="" width="260" height="180" fetchpriority="high">
      <img class="shop-counter" src="assets/app/front-counter.webp?v=0.8.0-preview" alt="" width="320" height="160" decoding="async">
      <img class="shop-guest" src="assets/app/front-customer.webp?v=0.8.0-preview" alt="" width="88" height="132" decoding="async">
    </div>
  </section>
</main>

<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div></div>
